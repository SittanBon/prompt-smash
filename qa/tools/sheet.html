<!doctype html>
<!-- QA helper: contact sheet. Usage: sheet.html?cols=4&title=...&imgs=a.png,b.png (paths relative to this file) -->
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#222;color:#eee;font:600 18px/1.3 system-ui,sans-serif;padding:20px}
  h1{font-size:22px;margin:0 0 14px}
  .g{display:grid;gap:14px}
  figure{margin:0} figcaption{font-size:14px;margin-bottom:6px;color:#ccc}
  img{width:100%;display:block;outline:1px solid #555}
</style></head><body><h1 id="t"></h1><div class="g" id="g"></div><script>
const q=new URLSearchParams(location.search);
t.textContent=q.get('title')||'';g.style.gridTemplateColumns=`repeat(${q.get('cols')||4},1fr)`;
for(const s of (q.get('imgs')||'').split(',')){const f=document.createElement('figure');f.innerHTML=`<figcaption>${s.split('/').pop()}</figcaption><img src="${s}">`;g.appendChild(f);}
</script></body></html>
